plugins:
    - - '@semantic-release/commit-analyzer'
      - preset: 'angular'
        releaseRules:
            - type: 'chore'
              scope: 'deps'
              release: 'patch'
            - type: 'chore'
              scope: 'deps-dev'
              release: 'patch'
            - type: 'build'
              scope: 'deps'
              release: 'patch'
            - type: 'hotfix'
              release: 'patch'
            - type: 'refactor'
              release: 'patch'
            - type: 'style'
              release: 'patch'
            - type: 'perf'
              release: 'patch'
    - - '@semantic-release/release-notes-generator'
      - preset: 'conventionalcommits'
        presetConfig:
            types:
                - type: 'feat'
                  section: 'Features'
                - type: 'fix'
                  section: 'Bug Fixes'
                - type: 'chore'
                  scope: 'deps'
                  section: 'Dependency Updates'
                  hidden: false
                - type: 'chore'
                  scope: 'deps-dev'
                  section: 'Dependency Updates'
                  hidden: false
                - type: 'build'
                  scope: 'deps'
                  section: 'Dependency Updates'
                  hidden: false
                - type: 'perf'
                  section: 'Performance Improvements'
                  hidden: false
                - type: 'refactor'
                  section: 'Refactoring'
                  hidden: false
                - type: 'style'
                  section: 'Refactoring'
                  hidden: false
                - type: 'docs'
                  section: 'Docs'
                  hidden: false
    - '@semantic-release/github'
