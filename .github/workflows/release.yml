name: release

on:
  push:
    branches:
      - main
      - master
      - v*.*
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - docs/**
      - .github/**
      - .gitea/**

jobs:
  composer-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer test:composer-validate

  composer-normalize:
    needs:
      - composer-validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:composer-normalize

  composer-audit:
    needs:
      - composer-validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:composer-audit

  composer-require-checker:
    needs:
      - composer-validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:composer-require-checker

  composer-unused:
    needs:
      - composer-validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:composer-unused

  linter:
    needs:
      - composer-normalize
      - composer-audit
      - composer-require-checker
      - composer-unused
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, cs2pr
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:linter | cs2pr

  refactoring:
    needs:
      - composer-normalize
      - composer-audit
      - composer-require-checker
      - composer-unused
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:refactoring

  psalm-static-analysis:
    needs:
      - composer-normalize
      - composer-audit
      - composer-require-checker
      - composer-unused
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:psalm-static-analysis -- --output-format=github

  phpstan-static-analysis:
    needs:
      - composer-normalize
      - composer-audit
      - composer-require-checker
      - composer-unused
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:phpstan-static-analysis

  unit-tests:
    needs:
      - composer-normalize
      - composer-audit
      - composer-require-checker
      - composer-unused
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      #      - run: composer test -- --colors=always --order-by=random --coverage-clover coverage.xml
      - run: composer test:unit-tests

  mutation-tests:
    needs:
      - composer-normalize
      - composer-audit
      - composer-require-checker
      - composer-unused
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
      - uses: ramsey/composer-install@v4
        with:
          composer-options: --optimize-autoloader
      - run: composer test:mutation-tests

  update-changelog:
    needs:
      - linter
      - refactoring
      - psalm-static-analysis
      - phpstan-static-analysis
      - unit-tests
      - mutation-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PUSH_ACCESS_TOKEN }}
      - run: git fetch && git pull
      - name: download npm files
        run: |
          if [ ! -f "package.json" ]; then
            curl -sSL https://raw.githubusercontent.com/forge-for-gitea/template-semantic-release/refs/heads/main/package.json > package.json \
              && printf "download: %s\n" "package.json"
          fi

          if [ ! -f "package-lock.json" ]; then
            curl -sSL https://raw.githubusercontent.com/forge-for-gitea/template-semantic-release/refs/heads/main/package-lock.json > package-lock.json \
              && printf "download: %s\n" "package-lock.json"
          fi
      - name: copy config files
        run: |
          if [ ! -f ".releaserc.yaml" ]; then

            if [ -d ".github" ]; then
              cp .github/semantic-release/.releaserc.yaml . \
                && printf "copied: %s\n" ".releaserc.yaml" \
                && exit 0;
            fi

            if [ -d ".gitea" ]; then
              cp .gitea/semantic-release/.releaserc.yaml . \
                && printf "copied: %s\n" ".releaserc.yaml" \
                && exit 0;
            fi

          fi
      - uses: cycjimmy/semantic-release-action@v6
        id: semantic-release
        with:
          dry_run: true
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: editing CHANGELOG.md
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          echo "${{ steps.semantic-release.outputs.new_release_notes }}" > new_release_notes.txt
          cat new_release_notes.txt CHANGELOG.md > NEW_CHANGELOG.md
          mv NEW_CHANGELOG.md CHANGELOG.md
          rm new_release_notes.txt
      - run: git status
        if: steps.semantic-release.outputs.new_release_published == 'true'
      - name: commit and push
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "docs(changelog): auto-update CHANGELOG.md"
          git push

  release:
    needs:
      - update-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: git fetch && git pull
      - name: download npm files
        run: |
          if [ ! -f "package.json" ]; then
            curl -sSL https://raw.githubusercontent.com/forge-for-gitea/template-semantic-release/refs/heads/main/package.json > package.json \
              && printf "download: %s\n" "package.json"
          fi

          if [ ! -f "package-lock.json" ]; then
            curl -sSL https://raw.githubusercontent.com/forge-for-gitea/template-semantic-release/refs/heads/main/package-lock.json > package-lock.json \
              && printf "download: %s\n" "package-lock.json"
          fi
      - name: copy config files
        run: |
          if [ ! -f ".releaserc.yaml" ]; then

            if [ -d ".github" ]; then
              cp .github/semantic-release/.releaserc.yaml . \
                && printf "copied: %s\n" ".releaserc.yaml" \
                && exit 0;
            fi

            if [ -d ".gitea" ]; then
              cp .gitea/semantic-release/.releaserc.yaml . \
                && printf "copied: %s\n" ".releaserc.yaml" \
                && exit 0;
            fi

          fi
      - uses: cycjimmy/semantic-release-action@v6
        id: semantic-release
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
